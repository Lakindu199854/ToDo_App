<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f7fc">
  <meta name="description" content="A shared board for daily tasks and weekly planning.">
  <title>Task Board</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=5">
  <script src="./config.js?v=4" defer></script>
  <script src="./time-zones.js" defer></script>
  <script src="./app.js?v=5" defer></script>
  <script src="./planning.js" defer></script>
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-pair" viewBox="0 0 24 24"><path d="m2 12 4 4 7-8m-2 7 2 2 9-10"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4m0 1c7-5 7 5 14 0v10c-7 5-7-5-14 0"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m14 6 4 4M4 20l4-1L20 7l-3-3L5 16l-1 4Z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2m3 0-1 15H6L5 6m5 4v7m4-7v7"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="m8 9 1 1 2-2m2 1h3m-8 6h8"/></symbol>
  </svg>
  <header class="topbar">
    <div class="topbar-inner shell">
      <div class="brand">
        <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-pair"></use></svg></span>
        <span>Task Board</span>
      </div>
      <span id="mode-badge" class="mode-badge" hidden><span></span><span id="mode-label"></span></span>
    </div>
  </header>

  <main class="shell">
    <section class="hero" aria-labelledby="welcome-title">
      <div class="hero-copy">
        <h1 id="welcome-title">Plan your <em id="hero-period">day.</em></h1>
        <p id="hero-description">Add tasks, set deadlines, and track what’s done.</p>
      </div>
      <div class="hero-art" aria-hidden="true">
        <span class="orbit orbit-large"></span><span class="orbit orbit-small"></span>
        <span class="sparkle sparkle-one"></span><span class="sparkle sparkle-two"></span>
        <span class="art-dot art-dot-one"></span><span class="art-dot art-dot-two"></span>
        <span class="art-card art-card-back">
          <span class="art-card-heading"><span class="art-tick"><svg class="icon"><use href="#i-check"></use></svg></span><span class="art-line art-line-main"></span></span>
          <span class="art-line"></span><span class="art-line art-line-short"></span>
        </span>
        <span class="art-card art-card-front">
          <span class="art-card-heading"><span class="art-tick"><svg class="icon"><use href="#i-check"></use></svg></span><span class="art-line art-line-main"></span></span>
          <span class="art-line"></span><span class="art-line art-line-short"></span>
        </span>
      </div>
    </section>

    <nav class="view-tabs" aria-label="Board sections">
      <a id="tasks-tab" href="#tasks" aria-current="page">Daily tasks</a>
      <a id="planning-tab" href="#planning">Weekly planning</a>
    </nav>

    <section id="board" class="board" aria-labelledby="board-title" hidden>
      <div class="board-heading">
        <div>
          <h2 id="board-title" tabindex="-1">Daily tasks</h2>
          <p id="day-label" aria-live="polite"></p>
        </div>
        <div class="date-controls">
          <button id="today-button" class="quiet button" type="button" hidden>Back to today</button>
          <div class="date-nav" role="group" aria-label="Choose a day">
            <button id="previous-day" class="icon-button" type="button" aria-label="Previous day">
              <svg class="icon" aria-hidden="true"><use href="#i-left"></use></svg>
            </button>
            <label class="date-picker">
              <svg class="icon" aria-hidden="true"><use href="#i-calendar"></use></svg>
              <span id="date-picker-label" aria-hidden="true"></span>
              <input id="date-input" type="date" aria-label="Choose a date" min="0001-01-01" max="9999-12-31" required>
            </label>
            <button id="next-day" class="icon-button" type="button" aria-label="Next day">
              <svg class="icon" aria-hidden="true"><use href="#i-right"></use></svg>
            </button>
          </div>
        </div>
      </div>

      <div id="board-error" class="board-error" hidden>
        <span id="board-error-text" role="alert"></span>
        <button id="board-retry" class="quiet button" type="button">Refresh</button>
      </div>
      <div id="columns" class="columns"></div>
      <footer class="board-footer">
        <svg class="icon" aria-hidden="true"><use href="#i-clock"></use></svg>
        <span id="board-note"></span>
      </footer>
    </section>

    <section id="planning-board" class="board" aria-labelledby="planning-title" hidden>
      <div class="board-heading">
        <div>
          <h2 id="planning-title">Weekly planning</h2>
          <p id="planning-week-label" aria-live="polite"></p>
        </div>
        <div class="date-nav" role="group" aria-label="Choose a planning week">
          <button id="previous-week" class="icon-button" type="button" aria-label="Previous week">
            <svg class="icon" aria-hidden="true"><use href="#i-left"></use></svg>
          </button>
          <button id="current-week" class="quiet button" type="button">This week</button>
          <button id="next-week" class="icon-button" type="button" aria-label="Next week">
            <svg class="icon" aria-hidden="true"><use href="#i-right"></use></svg>
          </button>
        </div>
      </div>
      <div id="planning-error" class="board-error" hidden>
        <span role="alert">Couldn’t load the planning notes.</span>
        <button id="planning-retry" class="quiet button" type="button">Refresh</button>
      </div>
      <div id="planning-columns" class="columns"></div>
      <footer class="board-footer">
        <svg class="icon" aria-hidden="true"><use href="#i-calendar"></use></svg>
        <span>Planning weeks run Sunday to Saturday in Colombo time.</span>
      </footer>
    </section>
  </main>

  <dialog id="task-dialog" aria-labelledby="task-dialog-title">
    <form id="task-form" class="dialog-content">
      <div class="dialog-heading">
        <div><h2 id="task-dialog-title">Add a task</h2><p id="task-dialog-person"></p></div>
        <button class="icon-button dialog-close" type="button" aria-label="Close">
          <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
        </button>
      </div>
      <div class="task-fields">
        <label class="field">Task name <input name="title" placeholder="What do you need to do?" maxlength="120" required></label>
        <div class="field-grid">
          <div>
            <label class="field">Planned for <input type="date" name="planned_date" min="0001-01-01" max="9999-12-31" required></label>
            <div class="date-shortcuts" role="group" aria-label="Planned date shortcuts" data-date-field="planned_date">
              <button class="secondary button" type="button" data-day-offset="0">Today</button>
              <button class="secondary button" type="button" data-day-offset="-1">Yesterday</button>
            </div>
          </div>
          <label class="field">Estimated minutes <input type="number" name="estimated_minutes" min="1" max="1440" placeholder="Optional"></label>
        </div>
        <div class="field-grid">
          <div>
            <label class="field">Due date <input type="date" name="due_date" min="0001-01-01" max="9999-12-31"></label>
            <div class="date-shortcuts" role="group" aria-label="Due date shortcuts" data-date-field="due_date">
              <button class="secondary button" type="button" data-day-offset="0">Today</button>
              <button class="secondary button" type="button" data-day-offset="-1">Yesterday</button>
            </div>
          </div>
          <label class="field">Due time <input type="time" name="due_time"></label>
        </div>
        <label class="field">Notes <textarea name="notes" rows="2" maxlength="1000" placeholder="Optional"></textarea></label>
        <p id="task-error" class="form-error" role="alert" hidden></p>
      </div>
      <div class="dialog-actions">
        <button class="secondary button dialog-close" type="button">Cancel</button>
        <button id="save-task" class="primary button" type="submit">Add task</button>
      </div>
    </form>
  </dialog>

  <dialog id="delete-dialog" aria-labelledby="delete-dialog-title">
    <form id="delete-form" class="dialog-content">
      <div class="dialog-heading"><h2 id="delete-dialog-title">Delete this task?</h2></div>
      <p id="delete-task-name" class="delete-task-name"></p>
      <p id="delete-error" class="form-error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button class="secondary button dialog-close" type="button" autofocus>Cancel</button>
        <button class="danger button" type="submit">Delete task</button>
      </div>
    </form>
  </dialog>

  <p id="announcement" class="sr-only" role="status"></p>
  <noscript><p class="shell">Enable JavaScript to use the task board.</p></noscript>
</body>
</html>
